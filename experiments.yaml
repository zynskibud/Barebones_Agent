# The experiment queue for Barebones Agent.
#
# One entry per experiment. Fields:
#   id          short name, used by scripts/run.sh and scripts/status.sh
#   priority    1 = first. 0 means the entry is already done, not queued.
#   status      done | ready | blocked-on <text> | planned
#   command     the exact shell line, or null if none exists yet
#   trials      trials in this experiment, or null if not designed yet
#   est_hours   estimated (or, for done entries, actual) machine hours
#   needs       ollama tag, docker yes/no, e2b yes/no, e2b_cost_usd estimate
#   done_when   a check a script can run to see if the experiment is finished
#   results     the results folder, or null
#
# Read this with: uv run python -c "import yaml; print(yaml.safe_load(open('experiments.yaml')))"

- id: exp1-v2-think-docker
  priority: 0
  status: done
  command: >-
    caffeinate -i uv run python src/evals/run.py
    --runs runs/exp1/v2-think-docker
    --config py.files-bash.docker.python.qwen3-8b.think
    --set prompt=config/system_prompt_v2.txt
  trials: 30
  est_hours: 1.75
  needs:
    ollama: qwen3:8b
    docker: yes
    e2b: no
  done_when: "30 result.json files with a non-null passed, under runs/exp1/v2-think-docker/*/trial-*/"
  results: runs/exp1/v2-think-docker
  note: >-
    Full rerun of the v2-think cell, in docker. The local attempt stopped at
    26 of 30 trials (11 passed); see exp1-v2-think-local-partial below. The
    coordinator decision (2026-09-25) is to keep the local partial cell and
    rerun the full cell in docker rather than resume it on local.
  result: "pass@1 0.333, pass@3 0.500, pass^3 0.200, 208 s per trial, 14 of 30 hit max_seconds; ended 2026-09-25 19:18"

- id: stage2-v2-docker
  priority: 2
  status: ready
  command: >-
    caffeinate -i uv run python src/evals/run.py
    --runs runs/stage2-v2 --stage 2
    --set prompt=config/system_prompt_v2.txt
  trials: 270
  est_hours: 6
  needs:
    ollama: qwen3:8b
    docker: yes
    e2b: yes
    e2b_cost_usd: 0.11
  done_when: "270 result.json files with a non-null passed, under runs/stage2-v2/*/*/trial-*/"
  results: runs/stage2-v2
  note: >-
    Stage 2 has 10 configurations; the local + files-bash one is blocked by
    the run.py guard, so 9 run (8 no-think at 45 to 140 s, 1 think at about
    210 s) x 30 trials = 270. One configuration is env: cloud, about 30
    trials x 100 s, about $0.11 of E2B time.

