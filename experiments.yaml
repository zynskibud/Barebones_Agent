- id: lever-2-auto-tests
  priority: 4
  status: ready
  command: >-
    caffeinate -i uv run python src/evals/run.py
    --runs runs/lever2-autocheck
    --config py.files-bash.docker.python.qwen3-8b.no-think
    --set prompt=config/system_prompt_v2.txt
    --set "auto_check=python -m pytest -q tests"
  trials: 30
  est_hours: 0.6
  needs:
    ollama: qwen3:8b
    docker: yes
    e2b: no
  done_when: "30 result.json files with a non-null passed, under runs/lever2-autocheck/*/*/trial-*/"
  results: runs/lever2-autocheck
  note: >-
    Python tasks only. Tasks 08 and 10 have no visible tests, so the command
    reports "no tests ran" with a non-zero exit; that is fine, it just means
    no auto_check feedback on those two tasks. Compare against the stage 2
    baseline row (py.files-bash.docker.python.qwen3-8b.no-think in
    runs/stage2-v2) to see the effect of the auto_check feedback loop.

- id: harbor-terminal-bench-2.1-subset
  priority: 5
  status: blocked-on coordinator GO and a 20-task subset list
  command: >-
    caffeinate -i env PYTHONPATH=. HARBOR_SET=prompt=config/system_prompt_v2.txt
    uv run harbor run
    --dataset terminal-bench/terminal-bench-2-1
    --agent src.evals.harbor.agent:BarebonesAgent
    --n-concurrent 1
    --jobs-dir runs/harbor-tb21
    --job-name tb21-subset
    -i TASK_1 -i TASK_2 -i TASK_3 -i TASK_4 -i TASK_5
    -i TASK_6 -i TASK_7 -i TASK_8 -i TASK_9 -i TASK_10
    -i TASK_11 -i TASK_12 -i TASK_13 -i TASK_14 -i TASK_15
    -i TASK_16 -i TASK_17 -i TASK_18 -i TASK_19 -i TASK_20
  trials: 20 x 1
  est_hours: 4
  needs:
    ollama: true
    docker: true
    e2b: false
  done_when: "20 trial folders under runs/harbor-tb21/tb21-subset/, each with agent/result.json and a verifier reward"
  results: runs/harbor-tb21
  note: >-
    Replace TASK_1..TASK_20 with the subset list. Before the first run:
    (1) the image pulls and builds are CPU-BULK under the protocol; pull them in a separate step with the heavy lock;
    (2) Terminal-Bench 2.1 tasks need Docker, and Harbor starts one container per task (its default --env is docker);
    (3) keep --n-concurrent 1 and the machine otherwise idle;
    (4) est_hours assumes 300 s for our loop plus about 5 min of build and verifier per task; Harbor's own per-task agent timeout is longer than our max_seconds, so our loop ends first;
    (5) check the dataset name with harbor dataset list or the Harbor Hub, and do a one-task smoke run first;
    (6) the container images must have bash and GNU timeout.

- id: full-grid-v2
  priority: 6
  status: planned
  command: >-
    caffeinate -i uv run python src/evals/run.py
    --runs runs/grid-v2
    --set prompt=config/system_prompt_v2.txt
  trials: 3780
  est_hours: 144
  needs:
    ollama: qwen3:8b
    docker: yes
    e2b: yes
    e2b_cost_usd: 10
  done_when: "3780 result.json files with a non-null passed, under runs/grid-v2/*/*/*/trial-*/"
  results: runs/grid-v2
  note: >-
    162 configurations minus 36 blocked (local + bash tool sets) = 126
    runnable configurations x 30 trials = 3,780 trials. 4 to 8 days of
    machine time. e2b_cost_usd is a rough estimate for the cloud
    configurations, well inside the $100 credit.

