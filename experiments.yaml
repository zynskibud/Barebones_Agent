- id: harbor-smoke
  priority: 0
  status: done
  command: >-
    caffeinate -i env PYTHONPATH=. HARBOR_SET=prompt=config/system_prompt_v2.txt
    uv run harbor run --dataset terminal-bench/terminal-bench-2-1
    --agent src.evals.harbor.agent:BarebonesAgent --n-concurrent 1
    --jobs-dir runs/harbor-smoke --job-name smoke -l 1
  trials: 1
  est_hours: 0.05
  needs:
    ollama: qwen3:8b
    docker: yes
    e2b: no
  done_when: "one trial folder under runs/harbor-smoke with agent/result.json"
  results: runs/harbor-smoke
  note: >-
    The first real Harbor run: one task from Terminal-Bench 2.1, chosen by
    Harbor (-l 1). Its purpose is to find what breaks (dataset name, image
    pull, bash and GNU timeout in the image, file ownership, the reward path).
    The image pull is CPU-BULK. Read runs/harbor-smoke and docs/harbor.md
    afterward and fix before the 20-task subset.
  result: >-
    Task write-compressor, 1/1 trial, 0 infra errors; ran 2026-09-27/28. The
    chain works end to end: image pull, agent run in the container, verifier,
    reward.txt. Agent: end_turn, 3 turns, 8.3 s, 2 bash calls, 0 malformed;
    it piped data.txt through the decompressor (segfault under qemu
    emulation), then wrote an empty data.comp and stopped. Verifier: 2 of 3
    tests passed, reward 0.0 (not a fraction of tests passed). See
    docs/pilot.md, "Harbor smoke", for the full write-up and the list of
    things to check before the subset.

- id: harbor-terminal-bench-2.1-subset
  priority: 1
  status: ready
  command: >-
    caffeinate -i env PYTHONPATH=. HARBOR_SET=prompt=config/system_prompt_v2.txt HARBOR_WALL_SECONDS=600
    uv run harbor run
    --dataset terminal-bench/terminal-bench-2-1
    --agent src.evals.harbor.agent:BarebonesAgent
    --n-concurrent 1
    --environment-build-timeout-multiplier 1.0
    --verifier-timeout-multiplier 0.67
    --agent-timeout-multiplier 0.67
    --jobs-dir runs/harbor-tb21
    --job-name tb21-subset
    -i terminal-bench/adaptive-rejection-sampler -i terminal-bench/build-pmars -i terminal-bench/chess-best-move -i terminal-bench/compile-compcert -i terminal-bench/crack-7z-hash
    -i terminal-bench/dna-assembly -i terminal-bench/feal-differential-cryptanalysis -i terminal-bench/fix-code-vulnerability -i terminal-bench/git-leak-recovery -i terminal-bench/hf-model-inference
    -i terminal-bench/largest-eigenval -i terminal-bench/make-doom-for-mips -i terminal-bench/model-extraction-relu-logits -i terminal-bench/multi-source-data-merger -i terminal-bench/password-recovery
    -i terminal-bench/polyglot-rust-c -i terminal-bench/pypi-server -i terminal-bench/qemu-startup -i terminal-bench/regex-log -i terminal-bench/sanitize-git-repo
  trials: 20 x 1
  est_hours: 4
  needs:
    ollama: true
    docker: true
    e2b: false
  done_when: "20 trial folders under runs/harbor-tb21/tb21-subset/, each with agent/result.json and a verifier reward"
  results: runs/harbor-tb21
  note: >-
    Tool set is files-bash, from config/baseline.yaml, unchanged; HARBOR_SET
    sets only the prompt, no auto_check (auto_check is Python-harness-only
    and does not apply to Harbor tasks; see docs/OPEN-QUESTIONS.md,
    2026-09-27, Harbor smoke rows). Concurrency is 1 (--n-concurrent 1).
    The 20 tasks were chosen with a fixed rule: list the 89 task names of
    terminal-bench/terminal-bench-2-1 (uv run harbor dataset download
    terminal-bench/terminal-bench-2-1 --export -o <dir>, then list the
    task folders under <dir>/terminal-bench-2-1/), sort them, take every
    4th name starting at index 0 (0, 4, 8, ...), then take the first 20 of
    those. Run only after the coordinator's GO. Before the first run:
    (1) the image pulls and builds are CPU-BULK under the protocol; pull them in a separate step with the heavy lock;
    (2) Terminal-Bench 2.1 tasks need Docker, and Harbor starts one container per task (its default --env is docker);
    (3) keep --n-concurrent 1 and the machine otherwise idle;
    (4) est_hours assumes 300 s for our loop plus about 5 min of build and verifier per task; Harbor's own per-task agent timeout is longer than our max_seconds, so our loop ends first;
    (5) the dataset name is confirmed (harbor dataset download terminal-bench/terminal-bench-2-1 --export lists 89 tasks under terminal-bench-2-1/); the harbor-smoke run already did the one-task smoke test;
    (6) the container images must have bash and GNU timeout;
    (7) the harbor-smoke task (write-compressor, not in this subset) showed the model can give up after one failed guess well inside the time and turn limits, and that its final message can violate the "do not ask the user questions" rule; watch for both in the subset, and note that Harbor's reward is not always a simple fraction of tests passed;
    (8) time caps, added after the machine slept overnight during qemu-emulated runs
    (docs/harbor.md, "Time caps"): the 19 tasks' task.toml files give typical Terminal-
    Bench 2.1 defaults of agent_timeout_sec 900, verifier_timeout_sec 900, and
    build_timeout_sec 600 (outliers: compile-compcert and dna-assembly run longer; read
    with runs/harbor-tb21/tb21-subset/config.json, task_names, against
    ~/.cache/harbor/tasks/packages/terminal-bench/<task>/*/task.toml). To bring each
    phase to about 10 minutes (600 s): build needs no change, 600 * 1.0 = 600 s, so
    --environment-build-timeout-multiplier 1.0; verifier and agent both need
    600 / 900 = 0.667, rounded to --verifier-timeout-multiplier 0.67 and
    --agent-timeout-multiplier 0.67. HARBOR_WALL_SECONDS=600 caps the adapter's own
    real (wall-clock) time on the agent phase, on top of Harbor's multiplier, so a sleep
    cannot stretch it; expiry = emulation timeout, excluded from the score with a note
    (src/evals/harbor/score.py).

