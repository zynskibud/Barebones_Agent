name: settings-parser-spaces
type: bug-fix
prompt: "`parse_settings` in src/lib.rs mishandles lines with extra or missing spaces around the equals sign, for example `port   =   8080` or `port=8080`. Fix it so every key and value comes back with no surrounding spaces."
test_command: "mkdir -p tests && cp hidden_tests/*.rs tests/ && cargo test -q --test 'hidden_*'"
limits:
  max_turns: 40
  max_seconds: 600
