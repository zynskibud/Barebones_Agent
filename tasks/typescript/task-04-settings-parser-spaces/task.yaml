name: settings-parser-spaces
type: bug-fix
prompt: "`parseSettings` in settings.ts mishandles lines with extra or missing spaces around the equals sign, for example `port   =   8080` or `port=8080`. Fix it so every key and value comes back with no surrounding spaces."
test_command: "node --test hidden_tests/*.test.ts"
limits:
  max_turns: 20
  max_seconds: 300
