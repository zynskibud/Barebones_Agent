name: menu-sort-by-price
type: feature
prompt: "Add a function `sort_by_price(menu)` to menu.py that returns a new list with the items ordered from the lowest price to the highest. Items with the same price keep their original order, and the input list must not change."
test_command: "python -m pytest hidden_tests -q"
limits:
  max_turns: 20
  max_seconds: 300
